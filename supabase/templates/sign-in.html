<!doctype html>
<html lang="nb">
  <body
    style="
      margin: 0;
      background: #0b0d12;
      color: #f2f0ea;
      font-family:
        -apple-system,
        Segoe UI,
        Helvetica,
        Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 48px 24px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 480px">
            <tr>
              <td style="font-size: 12px; letter-spacing: 0.16em; color: #a7adb8">HYAL</td>
            </tr>
            <tr>
              <td style="padding: 32px 0 8px; font-size: 15px; color: #a7adb8">
                Engangskode / One-time code
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: Menlo, Consolas, monospace;
                  font-size: 40px;
                  letter-spacing: 0.3em;
                  color: #f2f0ea;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 0; font-size: 15px; line-height: 1.6; color: #a7adb8">
                Skriv inn koden for å logge inn, eller
                <a href="{{ .ConfirmationURL }}" style="color: #5ef0c8">logg inn med denne lenken</a
                >. Koden gjelder i én time.<br />
                Enter the code to sign in, or
                <a href="{{ .ConfirmationURL }}" style="color: #5ef0c8">use this link</a>.
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; color: #6f7682">
                Ba du ikke om dette, kan du se bort fra e-posten. / If you did not ask for this,
                ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
