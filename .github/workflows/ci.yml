name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  # Public values (RLS protects the data); repository variables override them.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://zplgddrrdxtxhgvzlldw.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6SNaJXCmFx94ug-JrnMZlg_Vbdlj3Rd' }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck · Lint · Format · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test --coverage

  database:
    name: Migrations + seed apply on a fresh Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - run: supabase db reset
      - name: Every public table has RLS enabled
        run: |
          missing=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -At -c \
            "select string_agg(tablename, ', ') from pg_tables where schemaname = 'public' and not rowsecurity")
          if [ -n "$missing" ]; then echo "::error::RLS disabled on: $missing"; exit 1; fi
      - run: supabase db lint --level warning --fail-on error

  build-e2e:
    name: Build · Playwright · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
      - name: Lighthouse CI (mobile, budgets enforced)
        run: pnpm lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
